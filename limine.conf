# Timeout in seconds that Limine will use before automatically booting.
timeout: 10
verbose: yes
interface_resolution: 1024x768
interface_branding: os64 Operating System
# graphics: no

# ─────────────────────────────────────────────────────────────────────────────
# THE WALK, 2026-08-20 (Chris's ruling, after the rtl8125 arc landed). This
# file had grown to 29 entries and nobody could find anything in it. The rules
# applied, so the next person can apply them again:
#
#   1. An entry with NO `ROOT=` is not a boot, it is a decoration. Seven of
#      them (/Default, /No Serial Logging, /No Logging, /All Logging, /No SMP,
#      /No AHCI, /No NVME) carried a single bare token and no root at all —
#      the cmdline parser has no default root (kernel_commandline.c), so they
#      mounted nothing and never reached husk. They predated ROOT= entirely.
#      DELETED. Their tokens all still work: press `e` at this menu and add
#      one to any entry below (Limine's editor is enabled — no
#      `editor_enabled: no` above), which is the right home for a one-token
#      variation.
#   2. Duplicates go. Two entries carried byte-identical cmdlines.
#   3. Everything that survives is grouped: the machines people actually boot
#      at the top, the flashlights and harnesses at the bottom. A diagnostic
#      keeps its entry — a flashlight you must retype at a boot prompt is one
#      nobody picks up — it just does not get to sit above the daily driver.
#
# 29 entries became 19. Order below is the grouping, not history.
# ─────────────────────────────────────────────────────────────────────────────


# ═══ QEMU — the development dailies ══════════════════════════════════════════

# THE DEFAULT (promoted 2026-07-19, the day the OS got off FAT): root on the
# genuine ext2 partition. The old FAT-root entry lives at the BOTTOM of this
# file now — it's where the full test suite still runs (see its comment).
/QEMU Boot (ext2 root)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
    # ROOT= names the ext2 partition (partition 2 of the same disk), mounted
    # READ-WRITE since the 2026-08-07 ratification; the FAT partition
    # auto-mounts at /fat via the mount table. The ext2 image carries its
    # own /bin and /etc (debugfs-written at build time), so husk and
    # friends run from genuine ext2. The full test suite RUNS here,
    # write paths included — `make fsck-ext2` afterward is the
    # constitution (e2fsck must stay green).
	# LOGD=<file>: launch /bin/logd before the tests and, until it attaches,
	# keep the kernel drainer OFF the serial port. The log lands on /home —
	# the data disk, which is the one filesystem here that survives a rebuild,
	# so the file accumulates across boots instead of vanishing with the image.
	# NO TZ= here since 2026-08-04: the machine defaults to GMT and a human's
	# timezone is personal config — `export TZ=...` in their /home/husk.rc
	# (which is also the .rc mechanism's first real job).
	# NO SCHED= since 2026-08-05: tickless (park-and-nudge, né BSPSCHED) is the
	# kernel default now — absence of the flag IS the known-good scheduler.
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK CRON LOGD=/home/os64.log

/QEMU GUI Boot
	resolution: 1024x768
    # We use the Limine boot protocol.
    protocol: limine
    # Font path
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/os64_kernel
    # QEMU Boot plus the optional GUI subsystem (and its debug logging).
    # TICKLESS since 2026-08-13 — the day the kernel.c doctrine block
    # foretold: the preemption backstop retires the SCHED=periodic
    # workaround (the compositor pinned to core 1 is no longer
    # unpreemptable/nudge-only — the wedged-compositor scar, GRAPHICS.md #3,
    # is paid). BACKSTOP=10 because a compositor sharing its core at the
    # 50ms default animates like a slideshow; at 10ms it is smooth (his
    # shakedown). The quiet-logs entry at the bottom keeps SCHED=periodic as
    # the comparison lane.
    #
    # HUSK since the toolkit arc (2026-08-17): a GUI boot without a shell
    # was a museum — you could look but not touch. Keystrokes reach husk
    # through the console path (the keyboard driver feeds BOTH the console
    # buffer and the GUI input ring), and husk's output lands in the GUI
    # console window via the print sink, so this is a live shell INSIDE the
    # windowed world — which is also how ring-3 GUI clients (gfxprobe, the
    # ported demos) get launched until VT8 gives all of this a proper home.
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc BACKSTOP=10 KWORKER HUSK CRON GUI DEBUG_GUI



/Bosgame Boot (FAT LIFEBOAT — repair the ext2 root from here)
	resolution: 1024x768
	protocol: limine
	module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
	kernel_path: boot():/boot/os64_kernel
	# THE LIFEBOAT, and until 2026-08-16 the P5 did not have one. It sits
	# WITH its siblings rather than down in the utility pile on purpose: a
	# lifeboat you have to scroll for is a raft.
	#
	# Root is the PHYSICAL FAT partition — its own /bin, its own husk.rc,
	# deliberately never written by anything in normal operation. The point
	# is the day a bad refresh leaves the ext2 root unbootable: this entry
	# still comes up, and the ext2 partition auto-mounts at /ext2 READ-WRITE
	# (the default boot policy mounts every os64-authored partition at its
	# GPT name; the lifeboat ships no /etc/mounts.conf, so that default is
	# what runs here), and the broken root is sitting right there to be
	# repaired file by file.
	#
	# NO RAMDISK, and that is the entire difference from the "/RAMDisk Boot"
	# entries below. RAMDISK registers the RAM copy of the disk image FIRST
	# and then dedupes the physical partitions away by GUID — so a ramdisk
	# boot cannot see, let alone fix, the real disk. Those entries are for a
	# machine with no prepared storage; this one is for a machine whose
	# storage went wrong.
	#
	# The network comes up by DHCP: ICS on the build PC is this segment's
	# DHCP server, so a static IP= here would be a guess about a subnet ICS
	# owns. No IP= means the stack DISCOVERs — and the lease that comes back
	# NAMES the build PC, because under ICS the machine sharing its
	# connection IS the DHCP server and the gateway. The boot's own lease
	# line prints that address — "net: DHCP lease .../... gw X.X.X.X from
	# ..." (dhcp.c) — and the gw is the one to dial:
	#
	#     os64get <gw-from-the-lease-line> husk /ext2/bin/husk
	#
	# No hardcoded coordinates at all — the right property for the boot
	# where the wire may have been rearranged since anyone last looked. A
	# lifeboat that cannot reach the build PC is a raft.
	#
	# NO CRON HERE, and that is the same instinct as NO RAMDISK above
	# (Chris's call, 2026-08-29, adding the token to his own machine by hand
	# and stopping at this entry). The lifeboat exists to repair a broken
	# system; a scheduler running jobs of its own while you do that is the
	# opposite of what a rescue environment is for — and one of the jobs a
	# crontab might hold is the very refresh that broke the root.
	#
	# The r8125 NIC needs no token to come up — it is probed and brought up
	# like any other device, which is why the old "/Bosgame Boot (r8125 net —
	# the build segment)" entry was deleted in the 2026-08-20 walk: it
	# enabled nothing that this entry does not already do. Add DEBUG_NET with
	# `e` for the driver's own commentary (register read-backs, ring
	# addresses, per-frame detail) — on a machine with no debugger attached,
	# that IS the investigation.
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc KWORKER HUSK MAXCORES=4



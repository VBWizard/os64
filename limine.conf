/Bosgame Boot
	resolution: 1024x768
    # We use the Limine boot protocol.
    protocol: limine
    # Font path
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
	# An echo of /RAMDisk Boot plus Bosgame-specific parameters.
	module_path: boot():/boot/os64_disk.img
    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/os64_kernel
	# MAXCORES=4: the P5 has 12 cores; run just 4 while bringing the machine
	# up — fewer variables in play. Raise/remove once things prove stable.
	# SCHED=periodic: this is a GUI entry — same pinned-compositor exception as
	# the QEMU GUI entries, and this exact config is what was bare-metal
	# verified on the P5 (2026-07-06); not changing it out from under the
	# hardware by default-flip.
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc SCHED=periodic RAMDISK KWORKER MAXCORES=4 GUI nolog

# /Bosgame Boot (disk root) — UNCOMMENT after the one-time partition surgery
# in tools/p5-refresh.sh's header (carve + canonical GUIDs + mkfs + first
# refresh). Needs NO editing: the surgery assigns the same ROOT GUID the
# QEMU images carry, so this entry boots the P5's OWN ext2 partition as a
# writable root, /fat and /home auto-mount from their canonical GUIDs, and
# the RAMDisk module never loads — the slow self-contained entry above
# becomes the lifeboat-from-USB, this becomes the daily driver. Text boot,
# tickless, log to the persistent /home.
/Bosgame Boot (disk root)
	resolution: 1024x768
	protocol: limine
	module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
	kernel_path: boot():/boot/os64_kernel
	# nolog dropped 2026-08-08: it silenced every printd on the glass-less
	# wire during the first disk-root shakedown (test FAILs included), and
	# the 12-core logging crash it guarded against predates the logd daemon.
	# Re-add by hand if the bare metal disagrees.
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK MAXCORES=4 LOGD=/home/os64.log


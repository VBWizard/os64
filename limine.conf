# TESTPANIC's other sibling (2026-08-14): a deliberate wild-KERNEL-pointer #PF,
# which is the one path TESTPANIC does NOT exercise — a fatal fault reports
# through exception_report() and cli/hlt's on the spot, never reaching panic().
# That distinction hid a real bug: only panic() disabled the blit throttle, so
# with interrupts off (frozen tick clock) every line after the report's first
# SCROLL landed in the shadow buffer and never reached the glass. Boot this and
# LOOK AT THE SCREEN: the report must start at row 0 on a cleared panel and end
# with its call chain, paging if it overflows.
/QEMU Boot (TESTPF — fatal #PF report, on the glass)

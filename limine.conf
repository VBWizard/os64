# The scribble hunt's own entry (2026-08-14). WATCHDMA aims a HARDWARE
# watchpoint at each NVMe controller's write-DMA-buffer page table entry — the
# eight bytes that keep changing on the P5 — so the next rewrite traps AT THE
# INSTRUCTION and the report names the function that did it. TESTWATCH (the
# self-test for the same machinery) is the flag to boot instead if you only
# want to prove the watchpoint path still works.
/QEMU Boot (WATCHDMA - hardware watch on the DMA buffer's PTE)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf

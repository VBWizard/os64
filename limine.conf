# The old default, demoted 2026-07-19 when ext2 took the crown ("probably
# never run in fat mode again" — Chris, that same day). Kept near the bottom
# because it still has one important job: root on the WRITABLE FAT partition,
# no NOTESTS — this is where the FULL test suite (including every write-path
# test) runs. Boot this before blessing any kernel change.
/QEMU Boot (FAT root + full test suite)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
    # NVME DISK WAS: a116381c-5296-408d-98ec-2edb2c2d9bb4
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc KWORKER HUSK LOGD=/ext2/os64.log

# QEMU Boot + TESTPANIC: deliberately panics right after the post-boot tests.
# The standing diagnostic for the panic pipeline (direct serial + emergency
# log flush — see panic.c): boot this, then check the serial log ends with
# the panic banner, the flushed backlog, and the repeated message.
/QEMU Boot (TESTPANIC — panic-pipeline diagnostic)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc KWORKER HUSK TESTPANIC

# TESTPANIC's sibling (2026-08-08): boot + full suite + the whole shutdown
# descent — logd retire, emergency ring flush, sync_all, NVMe FLUSH CACHE,
# ACPI poweroff. Under QEMU the process EXITING is the pass: a scriptable
# end-to-end check of the entire going-down pipeline. (ext2 root, logd on,
# same config as the default entry — the descent should always be tested
# with a live log daemon to retire.)
/QEMU Boot (SHUTDOWNTEST — shutdown-descent diagnostic)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK LOGD=/home/os64.log SHUTDOWNTEST

# The legacy every-core-100Hz scheduler, by explicit request only (tickless
# became the default 2026-08-05). Two jobs: (1) the diagnostic flashlight — a
# dumb, predictable scheduler mode for when the clever one misbehaves (the
# same reason Linux still ships periodic HZ eighteen years after NO_HZ); and
# (2) THE REPRO for the open /idle2 stray write (SCHEDULER_STRAY_WRITE.md is
# the authority) — that bug lives in this mode's context-switch path and must
# stay reachable until it dies. Do not delete this entry before that bug does.
/QEMU Boot (periodic legacy scheduler)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 SCHED=periodic KWORKER HUSK LOGD=/home/os64.log


# TESTPANIC's sibling (2026-08-08): boot + full suite + the whole shutdown
# descent — logd retire, emergency ring flush, sync_all, NVMe FLUSH CACHE,
# ACPI poweroff. Under QEMU the process EXITING is the pass: a scriptable
# end-to-end check of the entire going-down pipeline. (ext2 root, logd on,
# same config as the default entry — the descent should always be tested
# with a live log daemon to retire.)
/QEMU Boot (SHUTDOWNTEST — shutdown-descent diagnostic)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK CRON LOGD=/home/os64.log SHUTDOWNTEST

# The descent's OTHER ending. Same diagnostic idea as the entry above, aimed
# at the one step a normal boot can never exercise: the reset. The reset path
# is also the part most likely to differ between a hypervisor and real iron
# (0xCF9 → 8042 pulse → triple fault, in that order), which is exactly why it
# needs a way to be proven on a MACHINE — the P5 can boot this before a
# userland `reboot` exists. Under QEMU, run WITHOUT -no-reboot: a pass looks
# like a second boot banner in the same serial log.
/QEMU Boot (REBOOTTEST — reset-path diagnostic)

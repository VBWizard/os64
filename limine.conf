# The old default, demoted 2026-07-19 when ext2 took the crown ("probably
# never run in fat mode again" — Chris, that same day). Kept near the bottom
# because it still has one important job: root on the WRITABLE FAT partition,
# no NOTESTS — this is where the FULL test suite (including every write-path
# test) runs. Boot this before blessing any kernel change.
/QEMU Boot (FAT root + full test suite)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
    # NVME DISK WAS: a116381c-5296-408d-98ec-2edb2c2d9bb4
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc BSPSCHED KWORKER HUSK

# QEMU Boot + TESTPANIC: deliberately panics right after the post-boot tests.
# The standing diagnostic for the panic pipeline (direct serial + emergency
# log flush — see panic.c): boot this, then check the serial log ends with
# the panic banner, the flushed backlog, and the repeated message.
/QEMU Boot (TESTPANIC — panic-pipeline diagnostic)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc BSPSCHED KWORKER HUSK TESTPANIC


# Timeout in seconds that Limine will use before automatically booting.
timeout: 10
verbose: yes
interface_resolution: 1024x768
interface_branding: os64 Operating System
# graphics: no
# The entry name that will be displayed in the boot menu.
# THE DEFAULT (promoted 2026-07-19, the day the OS got off FAT): root on the
# genuine ext2 partition. The old FAT-root entry lives at the BOTTOM of this
# file now — it's where the full test suite still runs (see its comment).
/QEMU Boot (ext2 root)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
    # ROOT= names the ext2 partition (partition 2 of the same disk), mounted
    # READ-WRITE since the 2026-08-07 ratification; the FAT partition
    # auto-mounts at /fat via the mount table. The ext2 image carries its
    # own /bin and /etc (debugfs-written at build time), so husk and
    # friends run from genuine ext2. The full test suite RUNS here,
    # write paths included — `make fsck-ext2` afterward is the
    # constitution (e2fsck must stay green).
	# LOGD=<file>: launch /bin/logd before the tests and, until it attaches,
	# keep the kernel drainer OFF the serial port. The log lands on /home —
	# the data disk, which is the one filesystem here that survives a rebuild,
	# so the file accumulates across boots instead of vanishing with the image.
	# NO TZ= here since 2026-08-04: the machine defaults to GMT and a human's
	# timezone is personal config — `export TZ=...` in their /home/husk.rc
	# (which is also the .rc mechanism's first real job).
	# NO SCHED= since 2026-08-05: tickless (park-and-nudge, né BSPSCHED) is the
	# kernel default now — absence of the flag IS the known-good scheduler.
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK LOGD=/home/os64.log

# The two scheduler flashlights (2026-08-13, the backstop arc), kept as REAL
# entries because a flashlight you must retype at a boot prompt is one nobody
# picks up. Periodic = the legacy every-core-100Hz mode, the fast reproducer
# for the shared AP timer-interrupt path (kernel.c's doctrine block above
# kTicklessScheduler says why it must never rot). NOBACKSTOP = today's
# tickless minus the preemption lease, the A/B lane for anything the
# backstop is suspected of.
/QEMU Boot (SCHED=periodic — the flashlight)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 SCHED=periodic KWORKER HUSK LOGD=/home/os64.log

/QEMU Boot (tickless, NOBACKSTOP)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 NOBACKSTOP KWORKER HUSK LOGD=/home/os64.log

/QEMU Boot (TAP net — the real internet)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
    # The ext2-root entry above, aimed at a host tap device instead of slirp.
    # slirp is a TCP/UDP NAT living inside the QEMU process: it answers ARP
    # and gateway pings itself but cannot relay ICMP to the real internet on
    # a stock WSL2 host — which is why `ping 8.8.8.8` times out under
    # run-net and works here. tap0 is a real L2 wire to the host kernel;
    # the host forwards + masquerades (see the run-tap target in the root
    # GNUmakefile for the one-time host setup). Static IP= because there is
    # no DHCP server on the tap — the kernel's IP=/GW= tokens exist for
    # exactly this, and their presence skips the DHCP wait entirely.
	# No SCHED= token: tickless is the default (this entry was born on the net
	# branch saying BSPSCHED, before the 2026-08-05 rename reached it).
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK TZ=EST5EDT IP=10.0.3.15 GW=10.0.3.1 MASK=255.255.255.0


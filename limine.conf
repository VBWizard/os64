# Timeout in seconds that Limine will use before automatically booting.
timeout: 10
verbose: yes
interface_resolution: 1024x768
interface_branding: os64 Operating System
# graphics: no
# The entry name that will be displayed in the boot menu.
# THE DEFAULT (promoted 2026-07-19, the day the OS got off FAT): root on the
# genuine ext2 partition. The old FAT-root entry lives at the BOTTOM of this
# file now — it's where the full test suite still runs (see its comment).
/QEMU Boot (ext2 root)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
    # ROOT= names the ext2 partition (partition 2 of the same disk), mounted
    # read-only by the ext2 driver; the FAT partition auto-mounts at /fat via
    # the mount table. The ext2 image carries its own /bin (same programs,
    # debugfs-written at build time), so husk and friends run from genuine
    # ext2. The test suite RUNS here — it is read-only-aware (write-path
    # tests report SKIP on a read-only root); the FAT entry at the bottom is
    # where the write paths get exercised for real.
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 BSPSCHED KWORKER HUSK TZ=EST5EDT

/QEMU Boot (TAP net — the real internet)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
    # The ext2-root entry above, aimed at a host tap device instead of slirp.
    # slirp is a TCP/UDP NAT living inside the QEMU process: it answers ARP
    # and gateway pings itself but cannot relay ICMP to the real internet on
    # a stock WSL2 host — which is why `ping 8.8.8.8` times out under
    # run-net and works here. tap0 is a real L2 wire to the host kernel;
    # the host forwards + masquerades (see the run-tap target in the root
    # GNUmakefile for the one-time host setup). Static IP= because there is
    # no DHCP server on the tap — the kernel's IP=/GW= tokens exist for
    # exactly this, and their presence skips the DHCP wait entirely.
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 BSPSCHED KWORKER HUSK TZ=EST5EDT IP=10.0.3.15 GW=10.0.3.1 MASK=255.255.255.0

/QEMU GUI Boot
	resolution: 1024x768
    # We use the Limine boot protocol.
    protocol: limine
    # Font path
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/os64_kernel
    # QEMU Boot plus the optional GUI subsystem (and its debug logging).
    # Deliberately NOT BSPSCHED: that mode masks the AP scheduler timers, so
    # the compositor pinned to core 1 would run unpreemptable/nudge-only.
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc KWORKER GUI DEBUG_GUI

/QEMU GUI Boot (quiet logs — temporary test entry)
	resolution: 1024x768
    protocol: limine
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc KWORKER GUI nolog DEBUG_GUI

/RAMDisk Boot
	resolution: 1024x768
    # We use the Limine boot protocol.
    protocol: limine
    # Font path
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
	# The QEMU NVMe disk image, byte for byte (GPT + BOTH partitions: FAT and
	# ext2). Limine loads it into RAM; the RAMDISK cmdline flag tells the
	# kernel to register it as a block device, and the ROOT= GUID below (the
	# RAM copy's ext2 partition — the RAMDisk registers FIRST, so it wins the
	# GUID scan over the physical NVMe twin) mounts it as the root filesystem.
	# The RAM FAT partition lands at /fat; physical-disk twins are GUID-deduped
	# away. Boots anywhere — no physical disk preparation needed. The suite
	# runs read-only-aware here, same as the default entry.
	module_path: boot():/boot/os64_disk.img
    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 RAMDISK KWORKER HUSK

/VBox Boot
	resolution: 1024x768
    # We use the Limine boot protocol.
    protocol: limine
    # Font path
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/os64_kernel
	cmdline: ROOTPARTUUID=2f4fd02e-68b4-4c82-98bc-72467529b3fc

/Bosgame Boot
	resolution: 1024x768
    # We use the Limine boot protocol.
    protocol: limine
    # Font path
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
	# An echo of /RAMDisk Boot plus Bosgame-specific parameters.
	module_path: boot():/boot/os64_disk.img
    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/os64_kernel
	# MAXCORES=4: the P5 has 12 cores; run just 4 while bringing the machine
	# up — fewer variables in play. Raise/remove once things prove stable.
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc RAMDISK KWORKER MAXCORES=4 GUI nolog


/RAMDisk Boot
	resolution: 1024x768
    # We use the Limine boot protocol.
    protocol: limine
    # Font path
    module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
	# The QEMU NVMe disk image, byte for byte (GPT + BOTH partitions: FAT and
	# ext2). Limine loads it into RAM; the RAMDISK cmdline flag tells the
	# kernel to register it as a block device, and the ROOT= GUID below (the
	# RAM copy's ext2 partition — the RAMDisk registers FIRST, so it wins the
	# GUID scan over the physical NVMe twin) mounts it as the root filesystem.
	# The RAM FAT partition lands at /fat; physical-disk twins are GUID-deduped
	# away. Boots anywhere — no physical disk preparation needed. The root is
	# writable here like everywhere (ratified 2026-08-07) — but it's the RAM
	# copy, so every write vanishes at power-off: the self-contained deal.
	module_path: boot():/boot/os64_disk.img
    # Path to the kernel to boot. boot():/ represents the partition on which limine.conf is located.
    kernel_path: boot():/boot/os64_kernel
	# LOGD lands on /fat here, not /home: the data disk is a separate image
	# file and does NOT ride the ISO as a module, so a ramdisk boot (the P5)
	# has no /home at all. /fat is the RAM-backed FAT partition — writable for
	# the session, gone at power-off, which is the deal everywhere on a
	# ramdisk boot.
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 RAMDISK KWORKER HUSK CRON LOGD=/fat/os64.log

/RAMDisk Boot (GUI — the desktop, self-contained)
	resolution: 1024x768
	protocol: limine
	module_path: boot():/boot/zap-light16.psf
	module_path: boot():/boot/zap-vga16.psf
	module_path: boot():/boot/zap-ext-light16.psf
	module_path: boot():/boot/pci_devices.bin
	module_path: boot():/boot/os64_disk.img
	kernel_path: boot():/boot/os64_kernel
	# The RAMDisk entry above, plus the desktop. Born 2026-08-17, the day the
	# GUI demos became ring-3 ELFs and the P5's PHYSICAL root turned out not
	# to have them: the kernel rides the ISO, but /bin rides the ROOT, and a
	# physical root only changes when something refreshes it. This entry
	# sidesteps the whole question — kernel AND /bin come off the ISO's
	# embedded disk image, matched by construction, no disk prep, pristine
	# every boot. Burn, boot, ball. Verified in QEMU 2026-08-17 (full
	# desktop, ring-3 demos, ball mid-flight, zero disks attached). The
	# physical-root entry stays the daily driver once its /bin catches up.
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 RAMDISK BACKSTOP=10 KWORKER HUSK CRON GUI DEBUG_GUI LOGD=/fat/os64.log



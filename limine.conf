# The A/B HARNESS entry (2026-08-09). Identical to the periodic entry above
# with ONE difference: no LOGD=, so the suite's verdict lands on the SERIAL
# WIRE where a script can grep it instead of inside /home/os64.log where only
# a human with a running shell can read it.
#
# It exists because the lost-wakeup bug is a RACE, and a race cannot be
# confirmed or refuted by a boot. Chris and I ran the SAME kernel minutes
# apart and got opposite verdicts on elf_loader — that is a coin, not a
# result. This entry is how you flip it fifty times unattended and compare
# proportions instead of anecdotes. Keep it: any future scheduler change
# wants exactly this measurement before anyone believes it.
/QEMU Boot (periodic — A/B harness, verdict on serial)

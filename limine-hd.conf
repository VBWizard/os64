# limine-hd.conf — the HD-boot menu: os64 from the machine's own disk, no
# thumb drive in sight.
#
# WHERE THIS FILE LIVES AND WHY IT WORKS (established 2026-08-21, by
# rehearsal in QEMU — including one instructive failure): the build writes
# this file into the disk image's FAT partition as /boot/limine/limine.conf,
# next to the kernel, its boot modules, AND Limine's own BOOTX64.EFI at
# /EFI/BOOT/ — so p5-refresh.sh's ordinary mirror makes the P5's lifeboat a
# COMPLETE boot volume with no extra step. One firmware NVRAM entry points
# at the lifeboat's BOOTX64.EFI ("ESP" is a convention, not a law — UEFI
# boots an EFI app from any FAT partition an entry names), and Limine finds
# this conf on its own volume.
#
# ITS OWN VOLUME is the load-bearing phrase. Limine 8.7 searches ONLY the
# volume it booted from — the first design parked the EFI app on the
# machine's real ESP with no conf, expecting a cross-volume search to land
# here, and the rehearsal answered with "[config file not found]". The same
# fact protects every other boot: an ISO/thumb/QEMU Limine reads the conf
# that rides with it (proven with a decoy conf, BIOS and UEFI alike) and
# never sees this one. This menu appears exactly and only when the lifeboat
# itself is the boot volume.
#
# Paths below still name the lifeboat explicitly by its canonical GUID
# (2f4fd02e-..., the one the build stamps on every image and the P5 surgery
# stamped on its lifeboat) rather than boot():/ — it costs nothing, reads
# unambiguously, and keeps every entry correct even if this file is ever
# read from an unexpected volume again.
#
# THE SELF-UPDATE LOOP this enables: /fat is mounted read-write inside a
# running os64, and this partition IS /fat — so `os64get` a fresh kernel to
# /fat/boot/os64_kernel (or edit this very menu at
# /fat/boot/limine/limine.conf — even replace the bootloader at
# /fat/EFI/BOOT/BOOTX64.EFI) and reboot. The OS updates itself over its own
# NIC; the thumb drive's remaining job is disaster recovery. The Windows
# ESP is never written by any of this.

timeout: 10
verbose: yes
interface_resolution: 1024x768
interface_branding: os64 Operating System (disk boot)

# The FAT lifeboat's canonical partition GUID — the one place it is spelled
# in this file's paths. (ROOT= GUIDs below are the KERNEL's cmdline business
# and unrelated to Limine path resolution.)
# fat:  2f4fd02e-68b4-4c82-98bc-72467529b3fc
# ext2: 1ec5f5ab-71b7-45cd-a7a4-05646e878e57

# The P5's daily driver, same shape as limine.conf's "/Bosgame GUI" — the
# desktop is what he boots, so it is first and it is the default.
/os64 GUI (the desktop)
	resolution: 1024x768
	protocol: limine
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-light16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-vga16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-ext-light16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/pci_devices.bin
	kernel_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK CRON MAXCORES=8 LOGD=/home/os64.log BACKSTOP=10 GUI

# Text-mode twin, same shape as "/Bosgame Boot - no GUI" (MAXCORES=4: fewer
# variables in play for a text shakedown, same ruling as the ISO entry).
/os64 (text, no GUI)
	resolution: 1024x768
	protocol: limine
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-light16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-vga16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-ext-light16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/pci_devices.bin
	kernel_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/os64_kernel
	cmdline: ROOT=1ec5f5ab-71b7-45cd-a7a4-05646e878e57 KWORKER HUSK CRON MAXCORES=4 LOGD=/home/os64.log

# The lifeboat, riding in its own boat: FAT root, own /bin, own husk.rc —
# the entry for the day a bad refresh eats the ext2 root. The ext2 partition
# still auto-mounts read-write at /ext2, sitting right there to be repaired.
# (Same doctrine as limine.conf's lifeboat entry; see its comment for the
# whole argument. A lifeboat you have to scroll for is a raft — it stays on
# the first screen here too.)
# NO CRON on this entry, deliberately (Chris, 2026-08-29): the lifeboat is
# for repairing a broken system, and a scheduler running jobs of its own
# while you do that is the opposite of what a rescue environment is for —
# one of those jobs could be the refresh that broke the root.
/os64 (FAT LIFEBOAT — repair the ext2 root from here)
	resolution: 1024x768
	protocol: limine
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-light16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-vga16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/zap-ext-light16.psf
	module_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/pci_devices.bin
	kernel_path: guid(2f4fd02e-68b4-4c82-98bc-72467529b3fc):/boot/os64_kernel
	cmdline: ROOT=2f4fd02e-68b4-4c82-98bc-72467529b3fc KWORKER HUSK MAXCORES=4

# Windows, one menu line away — named EXPLICITLY, because the generic
# spelling failed its first live test (2026-08-21, the P5): chainload_next
# hands control to the next bootable DEVICE, not the next partition. The
# Windows ESP rides the SAME disk Limine boots from, so the walk could not
# see it — with a USB enclosure plugged in it chainloaded the ENCLOSURE's
# fallback loader (a config-less GRUB shell), and with nothing else plugged
# in it answered "No other bootable device". So the ESP is named by
# PARTUUID. This is the P5's ESP (first partition of its internal NVMe) —
# a second machine gets its own GUID here the day one exists, or edits its
# live copy at /fat/boot/limine/limine.conf, which is the whole point of
# the self-updating boot volume. In QEMU rehearsals no volume carries this
# GUID and the entry fails politely if picked.
#
# NOTE (BitLocker/device encryption): chainloading changes the measured boot
# path, and a TPM-sealed BitLocker volume may demand its recovery key the
# first time Windows boots this way. Check `manage-bde -status` from Windows
# BEFORE relying on this entry; if encryption is on, have the recovery key
# handy or keep booting Windows via the firmware's own menu instead.
# (efi_chainload, not "chainload" — this Limine build's UEFI spelling; the
# bare name earned "Unsupported protocol specified" on the P5, third field
# lesson of the day. The binary's own string table is the authority.)
/Windows
	protocol: efi_chainload
	image_path: guid(98e28c08-c781-4071-9b92-f0c13be38d12):/EFI/Microsoft/Boot/bootmgfw.efi

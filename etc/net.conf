# /etc/net.conf — the network's opinions that are not an address or a route.
#
#   key = value        whitespace anywhere, '#' starts a comment
#
# Same ladder as every conf here: /home/net.conf first (yours), then this
# file (the system's, rewritten by every refresh). First file found wins.
#
# nameserver — whom to ask about names that are not in the hosts files.
# NORMALLY UNNECESSARY: the DHCP lease carries a name server (option 6),
# the kernel keeps it, and the resolver reads it from /sys/net/dhcp. Set
# this for a STATIC boot (the lifeboat has no lease), or to overrule the
# lease's choice. One address, dotted quad; the resolver asks one server.
#
nameserver = 8.8.8.8

# http2 — whether a program that fetches offers HTTP/2. It does unless this
# says off: every https connection made directly to a server offers it, and
# a server that takes it carries all of a page's requests to it at once on
# one connection. `off` makes every fetch speak HTTP/1.1, six connections
# to a host, as before HTTP/2 was spoken: for measuring one against the
# other, and for a site that will not work over it. Read once by each
# program as it starts fetching, so it reaches the programs started after
# an edit. (A /home/net.conf is read IN PLACE of this file, not on top of
# it: one that sets this needs its own nameserver line if this file's
# matters.)
#
# http2 = off

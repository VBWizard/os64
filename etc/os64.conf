# /etc/os64.conf — the system's root configuration.
#
# This is the ONE file in os64 that is never searched for. Everything else is
# found by walking the list below, because something has to be findable
# before a search path can exist.
#
# Grammar is every other os64 config's: `key = value`, `#` starts a comment,
# no sections, no quoting. (conf.h has the whole ruling.)

# WHERE CONFIG FILES ARE LOOKED FOR, first to last, first hit wins.
#
# Colon-separated, PATH's shape — 1979, and still the right one for "a list of
# places, in order". Eight directories at most; a config ladder longer than
# that is a symptom, not a setting.
#
# The default below is the persistence gradient every reader climbed
# separately before this file existed:
#
#   /home   YOURS. Its own partition and its own disk — never rebuilt, never
#           --delete'd. A file you put here outranks the system's copy and
#           survives every `make`.
#   /etc    the SYSTEM's, on the writable ext2 root. The build rewrites it,
#           so nothing you edit here is safe from the next rebuild.
#
# To keep your configs in a directory of their own, put it first:
#
#   conf = /home/conf:/home:/etc
#
# (/home/conf, not /home/.config — os64 has no dotfiles. Hiding files behind a
# leading '.' was never designed: an early Unix `ls` skipped "." and ".." by
# testing the first character, every name starting with '.' vanished with
# them, and the habit stuck. os64's readdir never delivers "." or ".." and has
# no dot magic to hide behind, so a visible directory is the honest shape.)
#
# Commented out because the default IS this line: uncomment only to change it.
# Whatever is active, `cat /sys/conf` shows the ladder in force AND which file
# each reader actually took, and the boot log says the same at DEBUG_BOOT.

# conf = /home:/etc

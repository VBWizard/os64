# Porter system destinations. /home/porter.conf overlays individual keys.
[destinations]
apps = /bin
libs = /lib
tests = /tests
boot = /fat/boot
config = /etc
fonts = /etc/fonts
frames = /etc/frames
pages = /tests/pages
icons = /etc/icons/default
certs = /etc/certs
licenses = /etc/licenses
themepacks = /var/themes
sounds = /home/sounds
videos = /home/videos
downloads = /home/downloads
downloads/*.mp4 = /home/videos

[backups]
directory = /home/archive
compression = gzip

# /etc/bootenv.conf — the environment every program is born with.
#
# The kernel applies this file to the first task's environment before it
# spawns anything, so every session root inherits it: the shells on VT1 and
# VT2, the desktop and everything gui.conf starts, logd, cron. `export` in
# husk.rc still works — it layers over this for that shell's children — but a
# variable that belongs to the MACHINE belongs here, where the desktop's
# clock can see it too.
#
# One variable per line, `NAME = value`. Names are verbatim (TZ is not tz),
# values are verbatim. A NAME with nothing after the `=` UNSETS it.
#
# This is the SYSTEM's copy and the build rewrites it. Yours goes in
# /home/bootenv.conf, which layers over this one name by name and survives
# every refresh — `cat /sys/conf` shows which was found. A TZ= on the boot
# cmdline outranks both, for that boot only.
#
# The lines below are the kernel's built-in defaults, so an untouched system
# is unchanged; uncomment one to change it.

# Where husk looks for programs. /tests comes second so a fixture can never
# shadow a command of the same name.
# PATH = /bin:/tests

# HOSTNAME = yogi.localhost.localdomain

# Classic V7 format: the offset counts hours WEST of UTC (their little
# prank), and the daylight-saving rule rides along. The machine speaks UTC
# until you say otherwise.
# TZ = EST5EDT

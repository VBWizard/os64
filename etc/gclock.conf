# gclock window state. A /home/gclock.conf replaces this system copy.
Position = 280,10
# true remembers the last normal position; false keeps Position as the anchor.
# Read again on close, so this can be changed while the clock is running.
SavePosition = true
Titlebar = off
Pinned = true

# Follow Appearance Workshop's Interface face. Inherit its size, or use 8..96
# pixels (try 32 for a larger clock). A builtin face at a size other than 16
# uses /etc/fonts/DejaVuSans.ttf. Changes to this file take effect on restart,
# except SavePosition and the startup Position used when saving is disabled.
FontSize = inherit
Blink = true

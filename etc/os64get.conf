# /etc/os64get.conf — download routing and backups of replaced originals.
# User guide: OS64GET.md in the source tree.
#
# os64's second configuration file (2026-08-22), in logd.conf's dialect:
#
#   key = value        whitespace anywhere, '#' starts a comment
#
# WHICH FILE WINS — the system conf search path, first hit, no merging.
# The `conf` key in /etc/os64.conf can change the default /home:/etc:
#
#   /home/os64get.conf   YOURS. Its own partition; survives every build and
#                        root refresh. Put your layout there.
#   /etc/os64get.conf    this file — the SYSTEM's. It lives on the ext2 root,
#                        which `make` rewrites, so edits here last until the
#                        next refresh. That is the persistence doctrine, not
#                        an accident (CLAUDE.md, ext2 section).
#
# THE RULES. A key is a file NAME (as requested from the valet — one path
# component, no directories), a `*.suffix` pattern, an `@lot` label, or the
# bare `*`; the value is the DIRECTORY the file is installed into under that
# same name. Precedence is by SPECIFICITY, not by position: an exact name
# beats a suffix pattern beats an `@lot` beats the `*` default, wherever each
# sits in the file. Within one class the LAST match wins, so a /home copy can
# repeat a line to override it.
#
# AN `@lot` MATCHES WHERE THE FILE CAME FROM, not what it is called (2026-08-29,
# the day /tests was split out of /bin). The valet labels a served directory —
# `os64serve.py .../userland/bin/tests=tests` — and every file from it carries
# that label. It exists because the fixtures share no suffix and no name
# pattern: nothing about the string "fputest" says it belongs in /tests, and
# a list of forty-seven names here would be stale by Tuesday.
#
# The lot is the WEAKEST claim a rule can make, deliberately, and that is what
# lets one served directory hold files bound for several places: kernel/bin
# carries fifteen fixtures for /tests, but also os64_kernel (named below, so
# /fat/boot) and libtest.so (a `*.so`, so /lib). Label the directory after
# where it CAME FROM and let this file decide where it goes.
#
# A DEST on the os64get command line beats all of this. No file at all (and
# no DEST) means what it meant before this file existed: the current
# directory — so the refresh that delivers a new os64get still works before
# the one that delivers its conf.
#
# HTTP/HTTPS URLs do not use these routing rules: they land in the current
# directory under the original URL's last path segment, or at an explicit DEST.
# They do not make replacement backups or use the archive setting below.
#
# The lineage is rdist(1), 4.3BSD 1985: the distfile says where things go and
# the tool just obeys.

os64_kernel     = /fat/boot            # the kernel boots from the lifeboat (limine-hd.conf)
limine.conf     = /fat/boot/limine     # the HD-boot menu, beside it
BOOTX64.EFI     = /fat/EFI/BOOT        # Limine itself — yes, the bootloader updates over the NIC too
pci_devices.bin = /fat/boot            # boot modules: Limine loads these before any filesystem exists
*.psf           = /fat/boot            # the fonts, same reason
*.so            = /lib                 # shared objects — libtest.so, and libos64.so since 2026-08-22
*.gdb           = /home                # host-side debugger artifacts (app_bases.gdb) ride along
                                       # because the valet serves whole DIRECTORIES, not a curated
                                       # list. They mean nothing to os64; this keeps them out of /bin.
@tests          = /tests               # the proof harness: userland/bin/tests, served as lot `tests`
@kernelbin      = /tests               # kernel/bin — its fixtures. os64_kernel and libtest.so come
                                       # from here too and go elsewhere: a name and a suffix rule
                                       # out-rank a lot, which is the point of the ordering
*               = /bin                 # everything else is a program

# The system's config files — including THIS one. Serve the repo's etc/ from
# the valet and `os64get HOST os64get.conf` installs the file that told it
# where to install it: the only file in the house that installs itself
# (Chris, 2026-08-22). Note these land on the ROOT partition, which the next
# refresh rewrites — a customized copy belongs at /home/<name>, the top of
# each ladder, where no refresh reaches.
husk.rc         = /etc                 # spelled out because the glob below cannot see
hosts           = /etc                 # them: no .conf suffix, so they would fall
crontab         = /etc                 # through to `* = /bin` and install as programs
*.conf          = /etc
# Others
*.ppm           = /home/images
*.bmp           = /home/images         # gview(1) reads both; libimage sniffs
                                       # the magic bytes, so the suffix here
                                       # is only about WHERE a file lands
*.png           = /home/images
# REPLACEMENT BACKUPS. Before replacing a different existing file, os64get
# copies and verifies the OLD destination under:
#
#     <archive>/YYYY-MM-DD/HHMMSS-<run>/destination/path
#
# Thus /bin/prog is backed up as .../<run>/bin/prog. A new destination or
# unchanged contents create no backup. -f forces fetching, not redundant
# backups of identical files. One run groups its originals under one folder.
# A completed backup is retained even if publication subsequently fails.
#
# With -a, downloads and required backups are prepared before installation
# starts. A preparation failure or Ctrl+C cleans incoming temporary files
# across the run and leaves the installed files untouched. Once installation
# renames start, Ctrl+C waits for that phase and cleanup to finish.
#
# Incoming downloads live in /tmp/os64get when that is on the destination's
# filesystem, otherwise in <mount>/.os64get-tmp. Handled failures clean up;
# crashes leave scratch files there. Boot does not automatically remove them.
# No downloaded copy is retained in the archive after a successful install.
#
# /home keeps the backups separate from the root filesystem rebuilt by make.
# Remove this setting, or pass -n/--no-archive, to replace without backups.
archive         = /home/archive

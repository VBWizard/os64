# /etc/desktop.conf — the desktop background (2026-08-23).
#
# Same grammar as every os64 config: key = value, '#' starts a comment.
# Same persistence gradient too: /home/desktop.conf wins over this file, so
# put YOURS there — this one is the system's and a rebuild rewrites it.
#
#   color = 0xRRGGBB     the fill (six hex digits; '#' is for comments)
#   image = /home/x.ppm  optional: an image drawn CENTERED over the color,
#                        never scaled — PPM (P6) or BMP, recognized by its
#                        MAGIC BYTES rather than its name, so the suffix here
#                        is only a convention. Size it for the screen first —
#                        tools/mkwall.py does that from any image. An image
#                        larger than the screen is cropped around its middle.
#
# Read by /bin/desktop, the desktop shell, which paints it into a real window
# at the bottom of the z-order. Until 2026-08-25 the KERNEL read this file and
# decoded the image in ring 0 — parsing a user-writable file behind the ring
# boundary, which is exactly the work that does not belong there.
#
# WITH NO CONFIG ANYWHERE you get a plain dark ground — /bin/desktop's own
# built-in colour. The compositor's clipping TEST PATTERN is no longer what an
# absent config shows: it is the FLOOR, painted by the kernel, and the shell's
# fullscreen window covers it. You see the test pattern when there is no
# shell — before it starts, if it failed to start, or if it died — which
# makes it a useful thing to recognise: a test pattern on the glass means
# "the desktop shell is not running", not "your config is missing".

color = 0x0c1830

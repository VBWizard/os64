# /etc/logd.conf — how the log DAEMON renders the lines it writes to the file.
#
# os64's first configuration file (2026-08-18). Everything about its syntax is
# deliberately boring, because whatever this file does, the next daemon that
# needs configuring will copy:
#
#   key = value        whitespace anywhere, '#' starts a comment
#
# No sections, no quoting, no escapes, no continuations. None of them have been
# asked for, and every one is easier to add later than to take away.
#
# WHICH FILE WINS. logd walks a persistence gradient and takes the first hit —
# the same ladder husk climbs for husk.rc, on purpose, because two config files
# that disagree about precedence is a trap nobody deserves at 2am:
#
#   /home/logd.conf   YOURS. Its own partition; survives builds and root
#                     refreshes untouched. Put your preference there.
#   /etc/logd.conf    this file — the SYSTEM's. It lives on the ext2 root,
#                     which `make` rewrites, so edits here last until the
#                     next build and no longer. That is the persistence
#                     doctrine (2026-08-07: root is the system's, /home is
#                     yours), not an oversight.
#   LOGFMT=<name>     inherited from the kernel cmdline when NO config file
#                     exists, so one flag can set both sinks at once.
#   classic           the floor.
#
# SERIAL IS CONFIGURED SEPARATELY, with LOGFMT= on the kernel cmdline — not out
# of symmetry but out of necessity: when serial matters most (a boot that dies
# before there is a filesystem) this file is unreachable. The two sinks share
# one renderer and one vocabulary of names; they do not share a setting, and
# usually shouldn't. Serial is where you debug, so it wants every raw field;
# the file is what you read afterwards, so it wants a clock.

# format — a NAME:
#
#   classic   17 (0x0020) AP3: message          what os64 has always printed;
#                                               still the best for hard debugging
#   daily     19:20:07 (17,3): message          a wall clock, ticks and core
#   full      2026-08-18 19:20:07 (17,3,0020) 9: message
#
# ...or a LAYOUT spelled out, using these escapes:
#
#   %d  date, YYYY-MM-DD        %k  ticks since boot
#   %t  time, HH:MM:SS          %c  core (the AP number, bare)
#   %T  thread id, 4 hex        %g  category (the DEBUG_* flag)
#   %l  level/priority          %m  THE MESSAGE — a format without it is
#   %%  a literal '%'               refused, since it would log decoration
#                                   and drop the thing being logged
#
# An unknown name, an unknown escape, or a missing %m is refused out loud and
# `classic` is kept. The log is the instrument you diagnose the typo WITH, so
# it is never allowed to become the casualty of one.
#
# Before the clock is read from the RTC — the first few lines of any boot —
# %d and %t render as ---------- and --:--:-- rather than a confident 1970.

format = daily

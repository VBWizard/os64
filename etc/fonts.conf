# Independent font roles. Sizes are nominal pixels, 8..96.
# builtin is the compatibility 8x16 face and requires size 16.
ui.face = builtin
ui.size = 16
terminal.face = builtin
terminal.size = 16
document.face = builtin
document.size = 16

# Installed families: DejaVu Serif, Sans and Sans Mono, each in regular,
# bold, italic/oblique and bold-italic/bold-oblique styles.
# Relative paths resolve beside this file. Appearance Workshop saves absolute
# paths when it writes a personal fonts.conf at the top of the config ladder.
# Optional fallback.1 and fallback.2 belong to each role and use its size.
# Example: document.fallback.1 = fonts/DejaVuSansMono.ttf

# Web families default to the installed DejaVu faces independently of roles.
# Missing bold/italic members inherit regular; missing bolditalic inherits bold.
# Relative paths are beside this file. Workshop Save preserves these lines.
# family.serif = fonts/DejaVuSerif.ttf
# family.serif.bold = fonts/DejaVuSerif-Bold.ttf
# family.serif.italic = fonts/DejaVuSerif-Italic.ttf
# family.serif.bolditalic = fonts/DejaVuSerif-BoldItalic.ttf
# family.sans = fonts/DejaVuSans.ttf
# family.mono = fonts/DejaVuSansMono.ttf
# family.serif.fallback.1 = fonts/DejaVuSans.ttf

# Independent font roles. Sizes are nominal pixels, 8..96.
# builtin is the compatibility 8x16 face and requires size 16.
ui.face = builtin
ui.size = 16
terminal.face = builtin
terminal.size = 16
document.face = builtin
document.size = 16

# Installed choices: fonts/DejaVuSans.ttf and fonts/DejaVuSansMono.ttf.
# Relative paths resolve beside this file. Appearance Workshop saves absolute
# paths when it writes a personal fonts.conf at the top of the config ladder.
# Optional fallback.1 and fallback.2 belong to each role and use its size.
# Example: document.fallback.1 = fonts/DejaVuSansMono.ttf

# /etc/menu.conf — the menus (2026-08-25).
#
# ONE FILE, EVERY LAUNCHER. /bin/grootmenu (the root menu — right-click the
# wallpaper) shows the menu named `root`; a dock or a panel, when one
# exists, reads this same file and shows whichever menu its config names.
# The grammar lives in libos64 (os64/menu.h), so two launchers can never
# disagree about what a menu file means.
#
# Found through the config search path like every os64 config: a
# /home/menu.conf REPLACES this system copy (first hit wins, whole file —
# this is a settings file, not a database, so it does not merge the way
# `hosts` does). Put yours there; this one is rewritten by every build.
#
# The grammar — twm's .twmrc (1987) with the f.verbs taken off:
#
#   menu <name> {                a NAMED menu (top level only)
#       item "Label" <command>   a line: label, then the command to run
#       separator                a rule (`---` also works)
#       menu "Label" { ... }     a CASCADE, written inline
#       menu "Label" <name>      a cascade BY REFERENCE to a named menu
#   }
#
# Keywords fold case. Labels, names and commands are DATA, verbatim: quote a
# label that has spaces; a command runs from the first word (the program's
# path — no PATH search, the desktop has no shell) to the end of the line,
# split on spaces with quotes honoured. Anything after '#' is a comment.

menu root {
    item "Terminal"      /bin/gterm
    item "Clock"         /bin/gclock
    separator
    menu "Demos" {
        item "Bounce"    /bin/gbounce
        item "Keys"      /bin/gkeys
    }
    menu "Tools" tools
    separator
    item "Reboot"        /bin/reboot
    item "Shut down"     /bin/shutdown
}

# Referenced from root's "Tools" cascade. A named menu nothing references is
# not an error — it is a menu waiting for a launcher to show it.
#
# CONSOLE PROGRAMS GO THROUGH gterm: `/bin/gterm <program> [args]` seats
# that program in a terminal window instead of husk, and the window closes
# when it exits. A console program started bare from a menu has no terminal
# anyone can see — it runs, prints to nowhere, and exits.
menu tools {
    item "Editor"        /bin/scribe
    item "Top"           /bin/gterm /bin/top
    item "Hex editor"    /bin/gterm /bin/hexedit
}

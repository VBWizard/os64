# Final extension = absolute application path. Case insensitive; last wins.
# Spaces in paths are literal. No quotes, shell commands or argument expansion.
# '#' begins a comment. Empty values leave that extension unassociated.
# Copy this file into your config directory to customize it; roam.conf can
# select a different filename or an absolute path. Open With can remember choices.
.txt = /bin/scribe
.md = /bin/scribe
.log = /bin/scribe
.c = /bin/scribe
.h = /bin/scribe
.conf = /bin/scribe

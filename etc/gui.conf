# /etc/gui.conf — what starts with the desktop.
#
# Found through the config search path (/etc/os64.conf's `conf =`), so a
# /home/gui.conf replaces this system copy entirely. `cat /sys/conf` says
# which one was used.
#
# Read ONCE, by gui_start(), and only on a GUI boot. That is the whole point
# of the file: GUI programs used to be started from husk.rc, which runs in
# EVERY husk — VT1 and VT2 both start one, so you got two of everything — and
# runs on text boots too, where every GUI line failed once per terminal.
# A desktop app's startup belongs to the desktop, which starts exactly once
# and only when there is one.

# ── start = <program> ───────────────────────────────────────────────────────
# One program per line, launched in the order written. Repeat it freely.
#
# IF THIS FILE EXISTS, ITS start LINES ARE THE WHOLE LIST — including when
# there are none, which is how you say "start nothing". The built-in default
# (the two demo apps, /bin/gbounce and /bin/gkeys) applies only when NO
# gui.conf is found anywhere. Otherwise "present, and starts nothing" would be
# unspellable, and a config you cannot use to turn something off is half a
# config.
#
# Uncomment what you want. These are the two Chris moved out of husk.rc:
#start = /bin/gterm
#start = /bin/gclock
#
# The demos, if you want them back:
#start = /bin/gbounce
#start = /bin/gkeys

# ── hello = yes | no ───────────────────────────────────────────────────────
# The "hello os64" window — the first window this compositor ever drew, and
# still the proof that the client API works end to end. Off by default HERE
# (this file's opinion); the built-in default with no config file at all is
# still `yes`, so an image without a gui.conf looks exactly as it always has.
# The code stays either way — kept for legacy's sake, on purpose.
hello = no

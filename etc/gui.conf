# /etc/gui.conf — what starts with the desktop.
#
# Found through the config search path (/etc/os64.conf's `conf =`), so a
# /home/gui.conf replaces this system copy entirely. `cat /sys/conf` says
# which one was used.
#
# Read ONCE, by /bin/desktop — the desktop shell — as it starts. This is the
# shell's rc, exactly as husk.rc is husk's, and a shell reads its own startup
# file. (It was read by the KERNEL until 2026-08-25, when the desktop moved
# to ring 3.) That is the whole point of the file: GUI programs used to be
# started from husk.rc, which runs in EVERY husk — VT1 and VT2 both start
# one, so you got two of everything — and runs on text boots too, where every
# GUI line failed once per terminal. A desktop app's startup belongs to the
# desktop, which starts exactly once and only when there is one.


# ── start = <program> ───────────────────────────────────────────────────────
# One program per line, launched in the order written. Repeat it freely.
#
# IF THIS FILE EXISTS, ITS start LINES ARE THE WHOLE LIST — including when
# there are none, which is how you say "start nothing". The built-in default
# (the two demo apps, /bin/gbounce and /bin/gkeys) applies only when NO
# gui.conf is found anywhere. Otherwise "present, and starts nothing" would be
# unspellable, and a config you cannot use to turn something off is half a
# config.
#
# Uncomment what you want. These are the two Chris moved out of husk.rc:
#start = /bin/gterm
#start = /bin/gclock
#
# The demos, if you want them back:
#start = /bin/gbounce
#start = /bin/gkeys

# ── launcher = [left|right|middle] <program> ───────────────────────────────
# What a click on BARE WALLPAPER runs — one program per button, told the
# click's position (`<program> x y`). The desktop draws nothing itself: the
# program it starts draws whatever ITS config says and exits. That is the
# ruling (Chris, 2026-08-25): the launcher is not a feature of the desktop,
# it is another thing this file starts, so a root menu today, a dock
# tomorrow and both the day after are edits HERE, not code anywhere.
#
# /bin/grootmenu is the root menu (twm's, 1987): it shows the menu named
# `root` in menu.conf. The button word is optional and defaults to right —
# and it comes FIRST: `launcher = /bin/grootmenu right` makes the whole
# value the path. The desktop opens the path as it reads this file and
# complains, by name, if it cannot; every desktop complaint goes to the
# kernel log (`cat /home/os64.log`) as well as its console, because on a
# GUI boot nobody is looking at that console.
launcher = right /bin/grootmenu

# ── hello — RETIRED 2026-08-25 ─────────────────────────────────────────────
# The "hello os64" window is gone: the first window this compositor ever drew,
# kept behind this switch since 2026-08-23, removed the day the desktop moved
# to ring 3. Chris's call — "If I want to reminisce, I can run an old build."
# It was also the last thing making the KERNEL read this file, so retiring it
# left gui.conf with exactly one reader (/bin/desktop), which is the whole
# point of a shell having an rc. A `hello` line here now does nothing.

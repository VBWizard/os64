<!doctype html>
<meta charset="utf-8">
<title>A video's fit</title>
<!--
  VIDEO.md § 5: object-fit and object-position on a <video>. Five boxes,
  each 300x300 with a grey background, the same clip in each (854x480,
  muted, looping), each with one object-fit: contain (the default: the
  whole picture, grey above and below), fill (stretched to the square),
  cover (the square filled, the sides cut), none (the picture at its own
  size, centred, cut to the box), scale-down (as none or contain,
  whichever is smaller: here contain). The sixth is contain with
  object-position: left top (grey only below).

  What to look for: the picture in each box as named, the rest of each box
  grey (the element's own background), never black.
-->
<style>
  body { font: 14px sans-serif; margin: 12px; }
  .cell { display: inline-block; margin: 6px; text-align: center; }
  video { width: 300px; height: 300px; background: #888; display: block; }
</style>
<h1>A video's fit</h1>
<div class="cell"><video src="bbb-480p-3s.mp4" autoplay muted loop></video>contain</div>
<div class="cell"><video src="bbb-480p-3s.mp4" autoplay muted loop style="object-fit: fill"></video>fill</div>
<div class="cell"><video src="bbb-480p-3s.mp4" autoplay muted loop style="object-fit: cover"></video>cover</div>
<div class="cell"><video src="bbb-480p-3s.mp4" autoplay muted loop style="object-fit: none"></video>none</div>
<div class="cell"><video src="bbb-480p-3s.mp4" autoplay muted loop style="object-fit: scale-down"></video>scale-down</div>
<div class="cell"><video src="bbb-480p-3s.mp4" autoplay muted loop style="object-position: left top"></video>contain, left top</div>

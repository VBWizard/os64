<!--
  The browser's Back passes over the entries a page makes before anybody
  touched it (way_crumb_t.skip), and holding Back lists where it can go.

  What to do. Click the big link below (a person's click: this page is
  touched, so its entry stays). The page it opens adds three entries to the
  history by itself, then sends you on to a second page, which adds two more.
  Neither is touched. Then:

    press Back once    you are back here, past seven entries the trap made
    hold Back          the list shows this page and whatever was before it,
                       and none of the trap's entries

  Click on the second page before pressing Back and its entries are yours:
  Back then steps through them, as it does in Chrome.
-->

<!doctype html><html><head><title>blends</title><style>
body{margin:0;font:13px sans-serif}
.grid{display:flex;flex-wrap:wrap;gap:6px;padding:8px}
.t{width:150px;height:62px;position:relative;background:linear-gradient(90deg,#f6d365,#fda085 45%,#5ee7df 75%,#4a5dd8)}
.m{position:absolute;left:12px;top:8px;width:126px;height:30px;background:linear-gradient(90deg,#d22,#2a2,#22d)}
.t span{position:absolute;left:4px;bottom:2px;font-weight:bold;color:#111}
.band{height:90px;margin:4px 8px;background:repeating-linear-gradient(90deg,#000 0 30px,#fff 30px 60px);position:relative}
.band h1{margin:0;position:absolute;left:20px;top:18px;font-size:44px;color:#fff;mix-blend-mode:difference}
.card{position:absolute;right:40px;top:12px;width:180px;height:66px;background:#f80;mix-blend-mode:multiply;filter:blur(1px);border-radius:12px}
</style></head><body><div class=grid><div class=t><div class=m style="mix-blend-mode:normal"></div><span>normal</span></div><div class=t><div class=m style="mix-blend-mode:multiply"></div><span>multiply</span></div><div class=t><div class=m style="mix-blend-mode:screen"></div><span>screen</span></div><div class=t><div class=m style="mix-blend-mode:overlay"></div><span>overlay</span></div><div class=t><div class=m style="mix-blend-mode:darken"></div><span>darken</span></div><div class=t><div class=m style="mix-blend-mode:lighten"></div><span>lighten</span></div><div class=t><div class=m style="mix-blend-mode:color-dodge"></div><span>color-dodge</span></div><div class=t><div class=m style="mix-blend-mode:color-burn"></div><span>color-burn</span></div><div class=t><div class=m style="mix-blend-mode:hard-light"></div><span>hard-light</span></div><div class=t><div class=m style="mix-blend-mode:soft-light"></div><span>soft-light</span></div><div class=t><div class=m style="mix-blend-mode:difference"></div><span>difference</span></div><div class=t><div class=m style="mix-blend-mode:exclusion"></div><span>exclusion</span></div><div class=t><div class=m style="mix-blend-mode:hue"></div><span>hue</span></div><div class=t><div class=m style="mix-blend-mode:saturation"></div><span>saturation</span></div><div class=t><div class=m style="mix-blend-mode:color"></div><span>color</span></div><div class=t><div class=m style="mix-blend-mode:luminosity"></div><span>luminosity</span></div><div class=t><div class=m style="mix-blend-mode:plus-lighter"></div><span>plus-lighter</span></div><div class=t><div class=m style="mix-blend-mode:plus-darker"></div><span>plus-darker</span></div></div>
<div class=band><h1>difference heading</h1><div class=card></div></div></body></html>

<!doctype html>
<!-- pile 3, S4c: every layer of a background. Compare with Chrome: the top
     layer is written first and painted last. The body's own two layers (a
     white wash over banner.png tiles) are the canvas's. -->
<html><head><title>layers</title>
<style>
body { margin: 16px; font-family: sans-serif;
       background: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), url(banner.png) }
.row { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap }
.b { width: 160px; height: 80px; padding: 10px; border: 6px dashed rgba(0, 0, 0, 0.4);
     font-size: 12px; color: #000 }
.l1 { background: url(banner.png) no-repeat center, linear-gradient(to right, #fc0, #930) }
.l2 { background: repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.25) 0 6px, transparent 6px 12px),
                  radial-gradient(circle, #fff, transparent 70%),
                  linear-gradient(#39c, #036) }
.l3 { background-image: url(banner.png), url(banner.png), url(banner.png);
      background-repeat: no-repeat;
      background-position: left top, center, right bottom;
      background-color: #9c9 }
.l4 { background: linear-gradient(#f66, #c00) content-box, #36c }
.l5 { background-image: url(banner.png), linear-gradient(90deg, #0c0, #060);
      background-size: 20px 10px, 50% 100%;
      background-repeat: repeat-x, no-repeat;
      background-position: 0 50%, right }
.l6 { background: url(banner.png) no-repeat 10px 10px / 80px, url(banner.png) no-repeat 30px 30px / 80px,
                  #ddd }
</style></head>
<body>
<div class=row><div class="b l1">picture over a gradient</div><div class="b l2">three gradients</div><div class="b l3">three copies, three places</div></div>
<div class=row><div class="b l4">content-box layer over a border-box colour</div><div class="b l5">lists of two: sizes, repeats, positions</div><div class="b l6">top layer first</div></div>
</body></html>

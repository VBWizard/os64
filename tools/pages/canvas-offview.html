<!doctype html><html><head><title>canvas offview</title><style>
/* Canvases under a group (opacity 0.5, or C's filter, so a drawing into
   one marks the whole view: canvas_damage_part) drawn into where the view
   cannot show
   them, then shown. Run with --damage-check: the counter's text
   changes every quarter second, so every rebuild compares the whole view
   with the window, and a canvas left stale on the glass is a difference.
   A: far below the fold, drawn into twice, then scrolled into view at 3 s:
      acknowledged unseen while out of view (the record's "out of view"),
      the scroll paints it from the bitmap as it then is, and a drawing
      after it shows is marked as ever.
   B: straddling the view's foot, 30 pixels of it in view: never
      acknowledged unseen, so the paint draws the part in view and only
      that acknowledges it. A rule that took a canvas partly in view for
      out of it would leave those 30 pixels stale.
   C: blurred (40px), its box 5 pixels below the view's foot and its blur
      reaching up into the view: seen, so marked (canvas_reach grows a
      canvas by each filter round it); a reach left ungrown would leave the
      blur's edge in view stale.
   D: rotated, far below the fold beside A: never taken for out of view,
      since a face may draw a group upright instead of through its matrix,
      somewhere the matrix does not say; the record's "out of view" counts
      A's two drawings and not D's. */
body{margin:0;height:3000px;background:#202020;color:#ddd;font:16px sans-serif}
.g{position:absolute;opacity:.5;width:100px;height:70px}
canvas{display:block;width:100px;height:70px}
#ga{left:20px;top:2000px}
#gb{left:150px}
#gc{left:300px;width:200px;opacity:1;filter:blur(40px)}
#gc canvas{width:200px}
#gd{left:150px;top:2000px;transform:rotate(5deg)}
#n{position:absolute;left:10px;top:10px}
</style></head><body>
<div class=g id=ga><canvas id=ca width=50 height=35></canvas></div>
<div class=g id=gb><canvas id=cb width=50 height=35></canvas></div>
<div class=g id=gc><canvas id=cc width=50 height=35></canvas></div>
<div class=g id=gd><canvas id=cd width=50 height=35></canvas></div>
<div id=n>0</div>
<script>
// B's top: 30 pixels above the view's foot, wherever the window puts it
// (clientHeight: the view less a scroll bar across it).
const foot = document.documentElement.clientHeight;
document.getElementById('gb').style.top = (foot - 30) + 'px';
// C's: 5 pixels below it.
document.getElementById('gc').style.top = (foot + 5) + 'px';
function paint(id, colour) {
  const x = document.getElementById(id).getContext('2d');
  x.fillStyle = colour;
  x.fillRect(0, 0, 50, 35);
  x.fillStyle = '#fff';
  x.fillRect(20, 5, 6, 25);
}
setTimeout(() => { paint('ca', '#c03'); paint('cb', '#c03'); paint('cd', '#c03'); }, 1000);
setTimeout(() => { paint('ca', '#09c'); paint('cb', '#09c'); paint('cd', '#09c'); }, 2000);
// C in turns of its own: B's mark is the whole view, which would cover it.
setTimeout(() => paint('cc', '#000'), 1500);
setTimeout(() => paint('cc', '#fff'), 2500);
setTimeout(() => window.scrollTo(0, 1900), 3000);
setTimeout(() => paint('ca', '#3a3'), 5000);
let n = 0;
setInterval(() => { document.getElementById('n').textContent = ++n; }, 250);
</script>
</body></html>

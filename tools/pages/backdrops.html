<!doctype html><html><head><title>backdrops</title><style>
body{margin:0;font:16px sans-serif}
.stripes{height:1500px;background:repeating-linear-gradient(45deg,#e33 0 20px,#33e 20px 40px,#3a3 40px 60px);padding-top:70px;color:#fff;font-weight:bold}
.stripes p{margin:0 0 30px 520px}
.h{position:fixed;top:0;left:0;width:100%;height:60px;backdrop-filter:blur(6px);background:rgba(255,255,255,.3);font-weight:bold;font-size:22px;line-height:60px;padding-left:20px}
.card{position:absolute;top:120px;left:40px;width:200px;height:120px;border-radius:24px;backdrop-filter:blur(10px) saturate(1.5);background:rgba(255,255,255,.2);text-align:center;line-height:120px}
.g{position:absolute;top:120px;left:280px;width:200px;height:120px;backdrop-filter:grayscale(1);text-align:center;line-height:120px}
.inv{position:absolute;top:280px;left:40px;width:200px;height:80px;backdrop-filter:invert(1);text-align:center;line-height:80px}
</style></head><body>
<div class=h>frosted header</div>
<div class=stripes><p>line one</p><p>line two</p><p>line three</p><p>line four</p><p>line five</p><p>line six</p><p>line seven</p><p>line eight</p></div>
<div class=card>card</div><div class=g>gray</div><div class=inv>invert</div>
</body></html>

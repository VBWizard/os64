<!doctype html>
<meta charset="utf-8">
<title>Posters</title>
<!--
  VIDEO.md § 5 (V.6.2): a <video>'s poster. HTML's show poster flag is set
  at each load and cleared by a play or a seek; while it is set and the
  poster has arrived the box shows the poster, even with a first picture
  ready; after it, the picture (and with autoplay, the poster until there
  is one: no gap). The box's natural size is the video's once known, else
  the poster's, else 300x150.

    A  a red poster and the clip, 240x135: red until "Play A" (the script
       plays it at 5 s and pauses it at 7 s), the picture after, and the
       pause does not bring the poster back
    B  a poster that fails: the clip's first picture
    C  a square blue poster in a 16:9 box: blue, letterboxed (object-fit
       contain), the box's background at its sides
    D  no poster, then one set by script at 1.5 s: red from then
    E  autoplay, muted, with a red poster: the picture once it plays, and
       red only until there is a picture
    F  a blue poster and no source, no size given: a 200x200 box, blue
    G  a red poster and no source, its poster taken away at 2.5 s: the box
       goes to 300x150 and its own green

  The title is A's paused (z) or playing (p) state and time, E's state,
  and F's and G's box sizes, every half second; the boxes' colours say the rest
  (the box's own background is green, which no clip picture is).
-->
<style>
  body { margin: 0; background: #ffffff; }
  video { position: absolute; background: #00ff00; }
  #a { left: 10px; top: 10px; width: 240px; height: 135px; }
  #b { left: 260px; top: 10px; width: 240px; height: 135px; }
  #c { left: 510px; top: 10px; width: 240px; height: 135px; }
  #d { left: 10px; top: 160px; width: 240px; height: 135px; }
  #e { left: 260px; top: 160px; width: 240px; height: 135px; }
  #f { left: 510px; top: 160px; }
  #g { left: 10px; top: 310px; }
</style>
<video id="a" poster="poster-red.png" src="bbb-480p-3s-av.mp4" muted preload="auto"></video>
<video id="b" poster="missing-poster.png" src="bbb-480p-3s-av.mp4" muted preload="auto"></video>
<video id="c" poster="poster-blue-square.png" src="bbb-480p-3s-av.mp4" muted preload="auto"></video>
<video id="d" src="bbb-480p-3s-av.mp4" muted preload="auto"></video>
<video id="e" poster="poster-red.png" src="bbb-480p-3s-av.mp4" muted autoplay loop></video>
<video id="f" poster="poster-blue-square.png"></video>
<video id="g" poster="poster-red.png"></video>
<script>
  const $ = id => document.getElementById(id);
  let step = 0;
  setInterval(() => {
    step++;
    if (step === 3) $('d').poster = 'poster-red.png';
    if (step === 5) $('g').removeAttribute('poster');
    if (step === 10) $('a').play();
    if (step === 14) $('a').pause();
    document.title = 'S' + step + ' a' + ($('a').paused ? 'z' : 'p') + $('a').currentTime.toFixed(1) +
      ' e' + ($('e').paused ? 'z' : 'p') + ' f' + $('f').clientWidth + 'x' + $('f').clientHeight +
      ' g' + $('g').clientWidth + 'x' + $('g').clientHeight;
  }, 500);
</script>

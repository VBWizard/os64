<p>Click this field (or Tab into it) and type Q during the countdown:</p>

<script>

var heldField = document.getElementById('field');

var firstUntil = Date.now() + 600;
while (Date.now() < firstUntil) {}
heldHeading.textContent = 'JavaScript donuts!';
console.log('J3:first-ready');
</script>
